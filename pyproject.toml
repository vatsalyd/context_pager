[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-pager"
version = "0.2.0"
description = "Context Pager: a context-paging MCP server that cuts agent token cost"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Thin relay on AWS free tier (t3.micro). NO torch/FlagEmbedding/llmlingua.
relay = [
    "fastmcp>=3.4.4",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]
# Heavy stack on the user's laptop. Models load lazily on first tool call.
bridge = [
    "fastmcp>=3.4.4",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "FlagEmbedding>=1.4.0",
    "llmlingua>=0.2.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    "sqlite-vec>=0.1.4",
    "tiktoken>=0.7.0",
    "torch>=2.0",
]
# Example goldfish agent
agent = [
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=1.0.0",
]

[project.scripts]
pager = "context_pager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

# CPU-only torch for the bridge; the relay never pulls torch.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/context_pager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
