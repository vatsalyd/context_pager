name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v5

      # First publish uses API token (project must exist before Trusted Publisher works).
      # After this run, configure Trusted Publisher on test.pypi.org and switch to:
      #   uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always dist/*
      - run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ --token ${{ secrets.TESTPYPI_API_TOKEN }} dist/*

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v5

      # Same as above — switch to --trusted-publishing always after first publish.
      - run: uv publish --check-url https://pypi.org/simple/ --token ${{ secrets.PYPI_API_TOKEN }} dist/*
